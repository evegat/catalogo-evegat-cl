server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  port_in_redirect off;
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.evegat.cl; connect-src 'self' https://formsubmit.co https://analytics.evegat.cl; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://formsubmit.co; upgrade-insecure-requests" always;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location ~* \.(css|js|png|svg|webp|webmanifest|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  }

  error_page 404 /index.html;
}
